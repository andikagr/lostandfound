<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- White circle background -->
  <circle cx="50" cy="50" r="50" fill="white"/>

  <!-- Handle kaca pembesar (batang diagonal ke kiri-bawah) -->
  <line x1="67" y1="67" x2="18" y2="93"
        stroke="#e31837" stroke-width="11" stroke-linecap="round"/>

  <!-- Ring "c" — arc tebal membentuk huruf c / kaca pembesar -->
  <path d="M 72 20 A 30 30 0 1 0 72 75"
        stroke="#e31837" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Glare putih di dalam lensa (kiri atas) -->
  <path d="M 28 32 Q 33 25 41 28"
        stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
